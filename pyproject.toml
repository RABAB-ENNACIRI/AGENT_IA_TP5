[project]
name = "agent-ia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RABAB ENNACIRI", email = "rababennaciri2002@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-openai>=1.7.3",
    "langgraph-checkpoint-postgres>=3.2.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
agent-ia = "agent_ia:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
